[project]
name = "localtok"
version = "0.1.0"
description = "htop for local LLM inference — a terminal dashboard for tokens/sec, VRAM and loaded models."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aman Zainal" }]
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
localtok = "localtok.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localtok"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
